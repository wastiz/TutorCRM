<div class="page">
  <div class="page-header"><h1>Create student</h1></div>

  <mat-tab-group>
    <mat-tab label="Manual">
      <div class="tab-body">
        <app-student-form
          submitLabel="Create student"
          [busy]="busy()"
          (save)="create($event)"
          (cancelled)="cancel()"
        />
      </div>
    </mat-tab>

    <mat-tab label="Import from message">
      <div class="tab-body">
        @if (!parsed()) {
          <mat-form-field class="wide" appearance="outline">
            <mat-label>Paste student message here…</mat-label>
            <textarea
              matInput
              rows="6"
              [formControl]="rawText"
              placeholder="Kirill Tsarenkov&#9;ljulap@gmail.com&#9;5350 6894&#9;…"
            ></textarea>
            <mat-hint>
              Tab-separated message or plain text — name, e-mail, phone and isikukood are recognized
              automatically.
            </mat-hint>
          </mat-form-field>
          <div class="actions">
            <button
              mat-flat-button
              color="primary"
              [disabled]="!rawText.value.trim() || parsing()"
              (click)="parse()"
            >
              <mat-icon>bolt</mat-icon>
              Parse
            </button>
          </div>
        } @else {
          <div class="preview-head">
            <span class="muted"
              >Parsed {{ parsed()!.fieldCount }} fields — review and correct before saving.</span
            >
            <button mat-button (click)="resetImport()">
              <mat-icon>restart_alt</mat-icon>
              Start over
            </button>
          </div>
          <app-student-form
            [value]="parsed()!.student"
            [warnings]="parsed()!.warnings"
            submitLabel="Create student"
            [busy]="busy()"
            (save)="create($event)"
            (cancelled)="resetImport()"
          />
        }
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
