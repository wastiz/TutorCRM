<div class="page">
  <div class="page-header"><h1>Edit student</h1></div>
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else if (student()) {
    <app-student-form
      [value]="student()!"
      submitLabel="Save changes"
      [busy]="busy()"
      (save)="save($event)"
      (cancelled)="cancel()"
    />
  }
</div>
