databaseChangeLog:
  - changeSet:
      id: 0007-01-create-email-template
      author: tutor-management
      changes:
        - createTable:
            tableName: email_template
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: kind, type: varchar(32), constraints: { nullable: false } }
              - column: { name: subject, type: varchar(500), constraints: { nullable: false } }
              - column: { name: body, type: varchar(20000), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - createIndex:
            tableName: email_template
            indexName: ix_email_template_user
            columns:
              - column: { name: user_id }
        - addForeignKeyConstraint:
            baseTableName: email_template
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_email_template_user
            onDelete: CASCADE
