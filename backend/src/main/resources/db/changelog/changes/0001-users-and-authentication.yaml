databaseChangeLog:
  - changeSet:
      id: 0001-01-create-users
      author: tutor-management
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: varchar(320), constraints: { nullable: false } }
              - column: { name: first_name, type: varchar(255) }
              - column: { name: last_name, type: varchar(255) }
              - column: { name: google_subject, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uq_users_email
        - addUniqueConstraint:
            tableName: users
            columnNames: google_subject
            constraintName: uq_users_google_subject

  - changeSet:
      id: 0001-02-create-authentication
      author: tutor-management
      changes:
        - createTable:
            tableName: authentication
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: provider, type: varchar(32), constraints: { nullable: false } }
              - column: { name: access_token, type: varchar(4096), constraints: { nullable: false } }
              - column: { name: refresh_token, type: varchar(4096) }
              - column: { name: access_token_expires_at, type: timestamptz }
              - column: { name: granted_scopes, type: varchar(2048) }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: authentication
            columnNames: user_id
            constraintName: uq_authentication_user_id
        - addForeignKeyConstraint:
            baseTableName: authentication
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_authentication_user
            onDelete: CASCADE
