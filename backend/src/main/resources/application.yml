spring:
  application:
    name: tutor-management

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/tutor}
    username: ${DATABASE_USERNAME:tutor}
    password: ${DATABASE_PASSWORD:tutor}
    hikari:
      # a handful of tutors never needs the default 10; each connection also costs
      # 5-10 MB on the Postgres side
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeit}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeit}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/calendar
              - https://www.googleapis.com/auth/spreadsheets
              - https://www.googleapis.com/auth/drive.metadata.readonly
              # send e-mail from the tutor's own address (templates feature)
              - https://www.googleapis.com/auth/gmail.send
            redirect-uri: "${APP_API_BASE_URL:http://localhost:8080}/login/oauth2/code/google"
        provider:
          google:
            # request offline access so Google returns a refresh_token
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      # default is 200; each thread reserves a stack we never use
      max: 20
      min-spare: 5

app:
  # Base URL of THIS backend service (used to build the OAuth redirect URI)
  api-base-url: ${APP_API_BASE_URL:http://localhost:8080}
  # Base URL of the Angular SPA (used for post-login redirect and CORS)
  web-base-url: ${APP_WEB_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # HMAC-SHA256 secret for the app session token. MUST be >= 32 bytes in production.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32b}
    # session lifetime
    ttl: ${JWT_TTL:PT12H}
    cookie-name: TMS_SESSION
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAMESITE:Lax}
  crypto:
    # AES key (base64, 16/24/32 bytes) for encrypting Google tokens at rest (CLAUDE.md 10.2)
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

logging:
  level:
    com.tutormgmt: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
