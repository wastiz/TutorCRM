# Copy to application-local.yml and fill in real values, then run with
#   SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
# application-local.yml is git-ignored.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-google-oauth-client-id.apps.googleusercontent.com
            client-secret: your-google-oauth-client-secret

app:
  jwt:
    secret: local-dev-secret-please-change-me-to-32-bytes-min
  crypto:
    # generate: openssl rand -base64 32
    token-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  # Local-only conveniences (see docs/DECISIONS.md). Ignored under any other profile.
  dev:
    # fill an empty demo account on startup
    seed-on-startup: true
    # set to true to wipe and re-create the demo data on every restart (fresh dates)
    reset-on-startup: false
    email: dev.tutor@example.com
    firstName: Dev
    lastName: Tutor
