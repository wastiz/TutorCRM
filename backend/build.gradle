plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tutormgmt'
version = '0.0.1-SNAPSHOT'

java {
    // CLAUDE.md section 4: Java 21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    mapstructVersion = '1.6.3'
    jjwtVersion = '0.13.0'
    testcontainersVersion = '1.20.6'
    googleApiClientVersion = '2.9.0'
    googleCalendarVersion = 'v3-rev20260708-2.0.0'
    googleSheetsVersion = 'v4-rev20260610-2.0.0'
    googleDriveVersion = 'v3-rev20260823-2.0.0'
    googleAuthLibVersion = '1.51.0'
}

dependencies {
    // --- Spring Boot starters ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- Persistence ---
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'

    // --- JWT (our own session token, signed with JWT_SECRET) ---
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // --- Mapping ---
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // --- Google API integration (Calendar + Sheets) ---
    implementation("com.google.api-client:google-api-client:${googleApiClientVersion}") {
        exclude group: 'com.google.guava', module: 'guava-jdk5'
    }
    implementation "com.google.apis:google-api-services-calendar:${googleCalendarVersion}"
    implementation "com.google.apis:google-api-services-sheets:${googleSheetsVersion}"
    implementation "com.google.apis:google-api-services-drive:${googleDriveVersion}"
    implementation "com.google.auth:google-auth-library-oauth2-http:${googleAuthLibVersion}"

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // --- Dev ---
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- Test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
