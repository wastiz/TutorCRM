services:
  db:
    image: postgres:16-alpine
    container_name: tms-postgres
    environment:
      POSTGRES_DB: tutor
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
    ports:
      - "5433:5432"
    volumes:
      - tms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tms-pgdata:
